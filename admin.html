<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>下午茶訂餐 - 開團者後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EE; --card:#FFFFFF; --ink:#4A3B2C; --muted:#A08E78;
  --primary:#BE8050; --primary-dark:#A26B3E; --primary-soft:#F7EAD7;
  --line:#EEE1CC; --danger:#C06A5A; --danger-soft:#F9EDE9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(#EFE3CF 1px,transparent 1.2px);background-size:24px 24px;
  -webkit-tap-highlight-color:transparent;
}
header{
  background:linear-gradient(150deg,#F6DDBD 0%,#EDC49C 60%,#E5B588 100%);
  padding:40px 20px 34px;text-align:center;
  border-radius:0 0 32px 32px;
  box-shadow:0 10px 30px rgba(190,140,90,.20);
  position:relative;overflow:hidden;
}
header::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.35),transparent 55%);
  pointer-events:none;
}
header h1{
  font-family:"Noto Serif TC",serif;font-size:1.7rem;font-weight:700;
  letter-spacing:.3em;text-indent:.3em;color:#5A3D22;position:relative;
}
header p{margin-top:8px;color:#8A6544;font-size:.88rem;letter-spacing:.2em;text-indent:.2em;position:relative}
main{max-width:640px;margin:0 auto;padding:22px 16px 60px}
.card{
  background:var(--card);border:1px solid #F3E9D6;border-radius:22px;
  padding:24px 20px;margin-bottom:18px;
  box-shadow:0 6px 20px rgba(190,140,90,.10);
}
.card h2{
  font-family:"Noto Serif TC",serif;font-size:1.18rem;font-weight:700;color:#5A3D22;
  letter-spacing:.12em;margin-bottom:18px;display:flex;align-items:center;gap:10px;
}
.card h2::after{content:"";flex:1;height:1px;background:var(--line)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{
  border-radius:18px;padding:18px 16px;text-align:center;border:1px solid transparent;
}
.stat .num{font-family:"Noto Serif TC",serif;font-size:1.9rem;font-weight:700}
.stat .lbl{font-size:.82rem;margin-top:6px;letter-spacing:.14em}
.stat.s1{background:#FBF1E2;border-color:#F0DFC2}.stat.s1 .num{color:#A26B3E}.stat.s1 .lbl{color:#B08D5E}
.stat.s2{background:#F3F5EE;border-color:#DFE5D6}.stat.s2 .num{color:#6E7F5E}.stat.s2 .lbl{color:#8A9B7E}
.stat.s3{background:#FBF0E8;border-color:#F0D5C2}.stat.s3 .num{color:#B0563F}.stat.s3 .lbl{color:#C08A76}
.stat.s4{background:#F1EFE9;border-color:#DED8C8}.stat.s4 .num{color:#6B5D43}.stat.s4 .lbl{color:#9A8A6E}
label{display:block;font-size:.85rem;color:var(--muted);margin:16px 0 8px;letter-spacing:.1em}
label:first-child{margin-top:0}
input,select,textarea{
  width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 15px;
  font-size:1rem;font-family:inherit;color:var(--ink);background:#FDFAF4;outline:none;
  transition:border-color .2s;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);background:#fff}
textarea{resize:vertical}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;border:none;border-radius:999px;padding:13px 30px;font-size:.98rem;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:.12em;
  box-shadow:0 6px 18px rgba(190,128,80,.30);transition:transform .15s;
}
.btn-primary:active{transform:scale(.96)}
.btn-small{
  background:var(--primary-soft);color:var(--primary-dark);border:1px solid #EAD3B4;
  border-radius:999px;padding:10px 22px;font-size:.92rem;font-weight:500;cursor:pointer;
  font-family:inherit;letter-spacing:.08em;transition:all .15s;white-space:nowrap;
}
.btn-small:active{transform:scale(.95);background:#F2DFC4}
.btn-danger{
  background:var(--danger-soft);color:var(--danger);border:1px solid #EBCFC6;
  border-radius:999px;padding:9px 18px;font-size:.88rem;cursor:pointer;font-family:inherit;
  white-space:nowrap;
}
.menu-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.menu-row input{padding:10px 12px;font-size:.95rem}
.menu-row .btn-danger{flex-shrink:0}
#menu-image-preview img{width:100%;border-radius:16px;margin:10px 0;box-shadow:0 6px 18px rgba(190,140,90,.15);cursor:zoom-in}
#menu-image-preview .btn-danger{margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{color:var(--muted);font-weight:500;font-size:.85rem;letter-spacing:.1em;padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
td{padding:11px 8px;border-bottom:1px solid #F5EDDD}
tr:last-child td{border-bottom:none}
.order{
  background:#FDFAF4;border:1px solid #F3E9D6;border-radius:16px;
  padding:15px 17px;margin-bottom:12px;
}
.order .head{display:flex;justify-content:space-between;font-weight:700;font-size:1.02rem;margin-bottom:6px}
.order .head span:last-child{color:var(--primary-dark)}
.order .items{color:#6B5B45;font-size:.93rem;line-height:1.7}
.order .note{color:var(--muted);font-size:.85rem;margin-top:6px}
.hint{font-size:.82rem;color:var(--muted);margin-top:8px;line-height:1.7}
/* 數字鍵盤 */
#keypad-modal{display:none;position:fixed;inset:0;background:rgba(74,59,44,.45);z-index:999;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.kp-sheet{background:#fff;width:100%;max-width:440px;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
#keypad-display{font-family:"Noto Serif TC",serif;font-size:2.2rem;font-weight:700;text-align:right;padding:12px 18px;background:var(--bg);border-radius:16px;margin-bottom:14px;min-height:70px;color:#5A3D22}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp-btn{font-size:1.5rem;padding:15px;border-radius:16px;border:1px solid var(--line);background:#FDFAF4;cursor:pointer;font-family:inherit;color:var(--ink);transition:all .12s}
.kp-btn:active{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(.94)}
.kp-btn.fn{color:var(--danger);font-size:1.2rem}
</style>
</head>
<body>
<header>
  <h1>開團者後台</h1>
  <p>即時監控訂購狀況</p>
</header>
<main>

<!-- 即時統計 -->
<div class="card">
  <h2>即時統計</h2>
  <div class="stats">
    <div class="stat s1"><div class="num" id="stat-people">0</div><div class="lbl">訂購人數</div></div>
    <div class="stat s2"><div class="num" id="stat-count">0</div><div class="lbl">總數量</div></div>
    <div class="stat s3"><div class="num">$<span id="stat-amount">0</span></div><div class="lbl">結單金額</div></div>
    <div class="stat s4"><div class="num" id="stat-orders">0</div><div class="lbl">訂單筆數</div></div>
  </div>
</div>

<!-- 開團設定 -->
<div class="card">
  <h2>開團設定</h2>
  <label>團購標題</label>
  <input id="set-title" placeholder="例如：週五下午茶 - 50嵐">
  <label>下單截止時間</label>
  <input id="set-deadline" type="datetime-local">
  <div style="margin-top:16px;"><button class="btn-primary" onclick="saveSession()">儲存設定</button></div>
</div>

<!-- 菜單管理 -->
<div class="card">
  <h2>菜單管理</h2>
  <label>上傳菜單圖片（看著圖片建品項，也會同步顯示在下單頁）</label>
  <input type="file" id="menu-image-upload" accept="image/*" onchange="handleMenuImageUpload(event)">
  <div id="menu-image-preview"></div>

  <label>從常用店舖快速帶入（先選店，再選品項）</label>
  <div class="row">
    <select id="preset-store" onchange="renderPresetItems()"></select>
    <select id="preset-item" onchange="applyPreset()"></select>
  </div>

  <label>或貼上菜單文字自動解析（看著菜單一次建好）</label>
  <textarea id="menu-paste" rows="4" placeholder="每行一個品項，名稱和價格用空格分開，例如：&#10;珍珠奶茶 60&#10;紅茶拿鐵 55"></textarea>
  <div style="margin-top:10px;"><button class="btn-small" onclick="previewMenuPaste()">解析預覽</button></div>
  <div id="paste-preview"></div>

  <label>手動新增單一品項</label>
  <div class="menu-row">
    <input id="new-name" placeholder="品項名稱" style="flex:2;">
    <input id="new-price" placeholder="點我輸入金額" readonly onclick="openKeypad(this)" style="flex:1;background:#FFF9F0;cursor:pointer;">
    <input id="new-cat" placeholder="分類" style="flex:1;">
    <button class="btn-small" onclick="addMenuItem()" style="flex-shrink:0;">新增</button>
  </div>
  <div id="menu-editor" style="margin-top:14px;"></div>
</div>

<!-- 品項彙總 -->
<div class="card">
  <h2>各品項彙總</h2>
  <table><thead><tr><th>品項</th><th>數量</th><th>小計</th></tr></thead><tbody id="item-summary"></tbody></table>
</div>

<!-- 訂單明細 -->
<div class="card">
  <h2>訂單明細</h2>
  <div id="order-list"><p style="color:var(--muted);">尚無訂單</p></div>
  <div style="margin-top:16px;display:flex;gap:10px;">
    <button class="btn-small" onclick="exportText()">匯出文字結單</button>
    <button class="btn-danger" onclick="clearOrders()">清空所有訂單</button>
  </div>
</div>
</main>

<!-- 數字鍵盤 -->
<div id="keypad-modal" onclick="if(event.target===this)closeKeypad()">
  <div class="kp-sheet">
    <div id="keypad-display">0</div>
    <div class="kp-grid">
      <button class="kp-btn" onclick="keypadPress('1')">1</button>
      <button class="kp-btn" onclick="keypadPress('2')">2</button>
      <button class="kp-btn" onclick="keypadPress('3')">3</button>
      <button class="kp-btn" onclick="keypadPress('4')">4</button>
      <button class="kp-btn" onclick="keypadPress('5')">5</button>
      <button class="kp-btn" onclick="keypadPress('6')">6</button>
      <button class="kp-btn" onclick="keypadPress('7')">7</button>
      <button class="kp-btn" onclick="keypadPress('8')">8</button>
      <button class="kp-btn" onclick="keypadPress('9')">9</button>
      <button class="kp-btn fn" onclick="keypadPress('clear')">清除</button>
      <button class="kp-btn" onclick="keypadPress('0')">0</button>
      <button class="kp-btn fn" onclick="keypadPress('back')">⌫</button>
    </div>
    <button class="btn-primary" style="width:100%;margin-top:14px;" onclick="keypadConfirm()">確認</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="db.js"></script>
<script>
let menu = [], orders = [], session = null;

// ===== 常用飲料店建議品項資料庫（先選店，再選品項，不用自己key）=====
const PRESET_STORES = {
"50嵐": [
{ name: "珍珠奶茶", price: 50 },
{ name: "奶茶", price: 45 },
{ name: "紅茶拿鐵", price: 55 },
{ name: "烏龍奶茶", price: 50 },
{ name: "波霸奶茶", price: 50 },
{ name: "椰果奶茶", price: 50 },
{ name: "四季春青茶", price: 30 },
{ name: "冰淇淋紅茶", price: 45 },
],
"清心福全": [
{ name: "珍珠紅茶拿鐵", price: 60 },
{ name: "優多綠茶", price: 50 },
{ name: "太妃紅茶", price: 45 },
{ name: "蜂蜜綠茶", price: 45 },
{ name: "多多綠茶", price: 45 },
{ name: "珍珠奶綠", price: 55 },
],
"迷客夏": [
{ name: "大甲芋頭鮮奶", price: 75 },
{ name: "珍珠紅茶拿鐵", price: 60 },
{ name: "伯爵紅茶拿鐵", price: 60 },
{ name: "柳橙綠茶", price: 55 },
{ name: "手炒黑糖鮮奶", price: 70 },
],
"麻古茶坊": [
{ name: "楊枝甘露2.0", price: 75 },
{ name: "芝芝葡萄果粒", price: 80 },
{ name: "珍珠奶茶", price: 60 },
{ name: "翡翠檸檬茶", price: 55 },
{ name: "金萱雙Q", price: 60 },
],
"CoCo": [
{ name: "珍珠奶茶", price: 55 },
{ name: "三兄弟", price: 65 },
{ name: "百香雙響炮", price: 60 },
{ name: "檸檬奇遇桔", price: 50 },
{ name: "鮮芋青稞大紅袍拿鐵", price: 70 },
],
"一芳": [
{ name: "粉圓鮮奶茶", price: 60 },
{ name: "一芳水果茶", price: 65 },
{ name: "鹿港麵茶鮮奶", price: 65 },
{ name: "古早味粉圓豆花", price: 55 },
],
"通用點心": [
{ name: "雞蛋糕(6顆)", price: 40 },
{ name: "車輪餅", price: 35 },
{ name: "葡式蛋撻", price: 45 },
{ name: "蔥抓餅", price: 40 },
],
};

function renderPresetStores() {
const sel = document.getElementById('preset-store');
sel.innerHTML = '<option value="">— 選擇店舖 —</option>' +
Object.keys(PRESET_STORES).map(s => `<option value="${s}">${s}</option>`).join('');
document.getElementById('preset-item').innerHTML = '<option value="">— 先選店舖 —</option>';
}
function renderPresetItems() {
const store = document.getElementById('preset-store').value;
const sel = document.getElementById('preset-item');
if (!store) { sel.innerHTML = '<option value="">— 先選店舖 —</option>'; return; }
sel.innerHTML = '<option value="">— 選擇品項 —</option>' +
PRESET_STORES[store].map((p, i) => `<option value="${i}">${p.name} $${p.price}</option>`).join('');
}
function applyPreset() {
const store = document.getElementById('preset-store').value;
const idx = document.getElementById('preset-item').value;
if (!store || idx === '') return;
const p = PRESET_STORES[store][parseInt(idx)];
document.getElementById('new-name').value = p.name;
document.getElementById('new-price').value = p.price;
document.getElementById('new-cat').value = store === '通用點心' ? '點心' : '飲品';
document.getElementById('preset-item').value = '';
}

// ===== 貼上菜單文字自動解析 =====
let pasteItems = [];
function previewMenuPaste() {
const text = document.getElementById('menu-paste').value;
const store = document.getElementById('preset-store').value;
const lines = text.split('\n').map(l => l.trim()).filter(l => l);
pasteItems = lines.map(line => {
const m = line.match(/^(.+?)[\s:：$＄\-–—|｜,，\/]+(\d+)\s*(?:元)?$/);
if (m) return { name: m[1].trim(), price: parseInt(m[2]), category: store === '通用點心' ? '點心' : (store || '飲品') };
return { name: line, price: 0, needPrice: true };
});
const box = document.getElementById('paste-preview');
if (!pasteItems.length) { box.innerHTML = '<p class="hint">沒有解析到品項，請確認每行格式如「珍珠奶茶 60」</p>'; return; }
previewMenuPasteRefresh();
}
function openPasteKeypad(i) {
const input = document.getElementById('pp-price-' + i);
openKeypad(input, null);
const origConfirm = window.keypadConfirm;
window.keypadConfirm = function() {
const v = parseInt(keypadValue) || 0;
if (keypadTarget) keypadTarget.value = v;
pasteItems[i].price = v;
closeKeypad();
window.keypadConfirm = origConfirm;
};
}
function removePasteItem(i) {
pasteItems.splice(i, 1);
previewMenuPasteRefresh();
}
function previewMenuPasteRefresh() {
const box = document.getElementById('paste-preview');
if (!pasteItems.length) { box.innerHTML = ''; return; }
box.innerHTML = `<p class="hint" style="font-weight:700;color:var(--ink);">解析到 ${pasteItems.length} 個品項，可直接修改後匯入：</p>` +
pasteItems.map((p, i) => `
<div class="menu-row">
<input value="${p.name.replace(/"/g, '&quot;')}" id="pp-name-${i}" style="flex:2;">
<input value="${p.price || ''}" placeholder="價格" readonly onclick="openPasteKeypad(${i})" style="flex:1;background:#FFF9F0;cursor:pointer;" id="pp-price-${i}">
<button class="btn-danger" onclick="removePasteItem(${i})">移除</button>
</div>`).join('') +
`<button class="btn-primary" style="margin-top:10px;" onclick="confirmPasteImport()">確認匯入 ${pasteItems.length} 個品項</button>`;
}
async function confirmPasteImport() {
let count = 0;
for (let i = 0; i < pasteItems.length; i++) {
const nameEl = document.getElementById('pp-name-' + i);
const priceEl = document.getElementById('pp-price-' + i);
const name = nameEl ? nameEl.value.trim() : pasteItems[i].name;
const price = priceEl ? parseInt(priceEl.value) || 0 : pasteItems[i].price;
if (!name || !price) continue;
await DB.addMenuItem({ name, price, category: pasteItems[i].category });
count++;
}
document.getElementById('menu-paste').value = '';
document.getElementById('paste-preview').innerHTML = '';
pasteItems = [];
alert(`已匯入 ${count} 個品項`);
}

// ===== 數字鍵盤 =====
let keypadTarget = null, keypadItemId = null, keypadValue = '';
function openKeypad(input, itemId) {
keypadTarget = input;
keypadItemId = itemId || null;
keypadValue = input.value || '';
document.getElementById('keypad-display').textContent = keypadValue || '0';
document.getElementById('keypad-modal').style.display = 'flex';
}
function keypadPress(k) {
if (k === 'clear') keypadValue = '';
else if (k === 'back') keypadValue = keypadValue.slice(0, -1);
else if (keypadValue.length < 6) keypadValue += k;
document.getElementById('keypad-display').textContent = keypadValue || '0';
}
function keypadConfirm() {
const v = parseInt(keypadValue) || 0;
if (keypadTarget) keypadTarget.value = v;
if (keypadItemId) editMenuItem(keypadItemId, 'price', v);
closeKeypad();
}
function closeKeypad() {
document.getElementById('keypad-modal').style.display = 'none';
keypadTarget = null; keypadItemId = null; keypadValue = '';
}

// ===== 菜單圖片上傳 =====
let menuImage = null;
function handleMenuImageUpload(event) {
const file = event.target.files[0];
if (!file) return;
if (file.size > 5 * 1024 * 1024) { alert('圖片太大，請選擇 5MB 以內的圖片'); return; }
const reader = new FileReader();
reader.onload = (e) => {
const img = new Image();
img.onload = () => {
const maxSide = 1000;
const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
const canvas = document.createElement('canvas');
canvas.width = Math.round(img.width * scale);
canvas.height = Math.round(img.height * scale);
canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
DB.setMenuImage(dataUrl).then(() => alert('菜單圖片已上傳，下單頁也會同步顯示'));
};
img.src = e.target.result;
};
reader.readAsDataURL(file);
event.target.value = '';
}
function renderMenuImage() {
const box = document.getElementById('menu-image-preview');
if (!menuImage) { box.innerHTML = ''; return; }
box.innerHTML = `<img src="${menuImage}" onclick="window.open('${menuImage}')" alt="菜單圖片">` +
`<div><button class="btn-danger" onclick="removeMenuImage()">刪除圖片</button></div>`;
}
async function removeMenuImage() {
if (confirm('確定刪除菜單圖片？下單頁也不會再顯示')) await DB.setMenuImage(null);
}

async function init() {
renderPresetStores();
session = await DB.getSession();
menu = await DB.getMenu();
orders = await DB.getOrders();
menuImage = await DB.getMenuImage();
renderAll();
renderMenuImage();
DB.onSessionChange(s => { session = s; renderSession();});
DB.onMenuChange(m => { menu = m; renderMenuEditor(); renderStats();});
DB.onOrdersChange(o => { orders = o; renderStats(); renderOrders();});
DB.onMenuImageChange(url => { menuImage = url; renderMenuImage();});
}

function renderAll() { renderSession(); renderMenuEditor(); renderStats(); renderOrders();}

function renderSession() {
document.getElementById('set-title').value = session?.title || '';
if (session?.deadline) {
const d = new Date(session.deadline);
document.getElementById('set-deadline').value = d.toISOString().slice(0, 16);
}
}

async function saveSession() {
const title = document.getElementById('set-title').value.trim() || '下午茶訂餐';
const deadline = document.getElementById('set-deadline').value;
await DB.saveSession({ title, deadline: deadline? new Date(deadline).toISOString(): null});
alert('設定已儲存，下單頁會即時更新');
}

function renderMenuEditor() {
document.getElementById('menu-editor').innerHTML = menu.map(item => `
<div class="menu-row">
<input value="${item.name}" onchange="editMenuItem('${item.id}','name',this.value)" style="flex:2;">
<input value="${item.price}" readonly onclick="openKeypad(this,'${item.id}')" title="點一下開啟數字鍵盤" style="flex:1;cursor:pointer;background:#FFF9F0;">
<input value="${item.category || ''}" placeholder="分類" style="flex:1;" onchange="editMenuItem('${item.id}','category',this.value)">
<button class="btn-danger" onclick="delMenuItem('${item.id}')">刪除</button>
</div>`).join('') || '<p class="hint">尚未新增品項</p>';
}
async function addMenuItem() {
const name = document.getElementById('new-name').value.trim();
const price = parseInt(document.getElementById('new-price').value);
if (!name ||!price) { alert('請輸入品項名稱和價格'); return;}
await DB.addMenuItem({ name, price, category: document.getElementById('new-cat').value.trim() || '飲品'});
document.getElementById('new-name').value = '';
document.getElementById('new-price').value = '';
document.getElementById('new-cat').value = '';
}
async function editMenuItem(id, field, value) {
const item = menu.find(m => m.id === id);
if (field === 'price') value = parseInt(value) || 0;
await DB.updateMenuItem(id, {...item, [field]: value});
}
async function delMenuItem(id) {
if (confirm('確定刪除這個品項？')) await DB.deleteMenuItem(id);
}

function renderStats() {
const people = new Set(orders.map(o => o.ordererName)).size;
let count = 0, amount = 0;
const summary = {};
orders.forEach(o => o.items.forEach(it => {
count += it.qty; amount += it.qty * it.price;
summary[it.name] = summary[it.name] || { qty: 0, amount: 0};
summary[it.name].qty += it.qty;
summary[it.name].amount += it.qty * it.price;
}));
document.getElementById('stat-people').textContent = people;
document.getElementById('stat-count').textContent = count;
document.getElementById('stat-amount').textContent = amount;
document.getElementById('stat-orders').textContent = orders.length;
document.getElementById('item-summary').innerHTML =
Object.entries(summary).map(([name, s]) => `<tr><td>${name}</td><td>${s.qty}</td><td>$${s.amount}</td></tr>`).join('')
|| '<tr><td colspan="3" style="color:var(--muted);">尚無資料</td></tr>';
}

function renderOrders() {
const list = document.getElementById('order-list');
if (!orders.length) { list.innerHTML = '<p style="color:var(--muted);">尚無訂單</p>'; return;}
list.innerHTML = [...orders].reverse().map(o => `
<div class="order">
<div class="head"><span>${o.ordererName}</span><span>$${o.items.reduce((s, it) => s + it.qty * it.price, 0)}</span></div>
<div class="items">${o.items.map(it => `${it.name} x${it.qty}`).join('、')}</div>
${o.note? `<div class="note">備註：${o.note}</div>`: ''}
<div class="note">${new Date(o.createdAt).toLocaleString('zh-TW')}</div>
</div>`).join('');
}

function exportText() {
let txt = `結單\n`;
txt += `人數：${new Set(orders.map(o => o.ordererName)).size}｜總數：${orders.reduce((s, o) => s + o.items.reduce((a, it) => a + it.qty, 0), 0)}｜總金額：$${document.getElementById('stat-amount').textContent}\n\n`;
orders.forEach(o => {
txt += `${o.ordererName}：${o.items.map(it => `${it.name}x${it.qty}`).join('、')}${o.note? `（${o.note}）`: ''}\n`;
});
navigator.clipboard.writeText(txt).then(() => alert('結單文字已複製'));
}

async function clearOrders() {
if (confirm('確定清空所有訂單？此動作無法復原')) await DB.clearOrders();
}

init();
</script>
</body>
</html>
