<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下午茶訂餐 - 下單</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #fff8f0; color: #333; line-height: 1.6; }
  header { background: #ff8c42; color: #fff; padding: 20px; text-align: center; }
  header h1 { font-size: 1.5rem; }
  #deadline-bar { background: #fff3e0; padding: 12px 20px; text-align: center; font-weight: bold; color: #e65100; border-bottom: 2px solid #ffcc80; }
  #deadline-bar.closed { background: #ffebee; color: #c62828; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  .category-title { margin: 20px 0 10px; font-size: 1.1rem; color: #bf5b00; border-left: 4px solid #ff8c42; padding-left: 8px; }
  .menu-item { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .menu-item .info .name { font-weight: bold; }
  .menu-item .info .price { color: #e65100; font-weight: bold; }
  .qty-ctrl { display: flex; align-items: center; gap: 10px; }
  .qty-ctrl button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #ff8c42; background: #fff; color: #ff8c42; font-size: 1.2rem; cursor: pointer; }
  .qty-ctrl button:active { background: #ff8c42; color: #fff; }
  .qty-ctrl .qty { min-width: 24px; text-align: center; font-weight: bold; }
  #order-form { background: #fff; border-radius: 12px; padding: 16px; margin-top: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #order-form label { display: block; margin: 10px 0 4px; font-weight: bold; }
  #order-form input, #order-form textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
  #total-bar { position: sticky; bottom: 0; background: #fff; border-top: 2px solid #ffcc80; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
  #total-bar .total { font-size: 1.3rem; font-weight: bold; color: #e65100; }
  #submit-btn { background: #ff8c42; color: #fff; border: none; border-radius: 10px; padding: 12px 28px; font-size: 1.1rem; cursor: pointer; }
  #submit-btn:disabled { background: #ccc; cursor: not-allowed; }
  #success-msg { display: none; background: #e8f5e9; border: 1px solid #66bb6a; border-radius: 10px; padding: 16px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="group-title">下午茶訂餐</h1>
  <p>選擇你想喝的下午茶吧！</p>
</header>
<div id="deadline-bar">載入中…</div>
<main>
  <div id="menu-image-box" style="display:none;margin-bottom:8px;">
    <button onclick="toggleMenuImage()" style="width:100%;background:#fff;border:1px solid #ffcc80;border-radius:10px;padding:10px;font-size:1rem;cursor:pointer;">📷 查看店家菜單圖片</button>
    <img id="menu-image" style="display:none;max-width:100%;border-radius:12px;margin-top:8px;" onclick="toggleMenuImage()">
  </div>
  <div id="menu-list"></div>
  <div id="order-form">
    <label for="orderer-name">訂購人姓名</label>
    <input id="orderer-name" type="text" placeholder="請輸入你的名字">
    <label for="order-note">備註（甜度、冰塊等）</label>
    <textarea id="order-note" rows="2" placeholder="例如：半糖去冰"></textarea>
  </div>
  <div id="success-msg">✅ 下單成功！開團者已經可以看到你的訂單了。</div>
</main>
<div id="total-bar">
  <div class="total">總計：$<span id="total-amount">0</span></div>
  <button id="submit-btn">送出訂單</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="db.js"></script>
<script>
// ===== 下單頁邏輯 =====
let menu = [];
let cart = {}; // menuId -> qty
let session = null;

async function init() {
  session = await DB.getSession();
  menu = await DB.getMenu();
  renderSession();
  renderMenu();
  updateTotal();

  // 監聽即時更新（開團者改菜單或截止時間時自動刷新）
  DB.onSessionChange((s) => { session = s; renderSession(); });
  DB.onMenuChange((m) => { menu = m; renderMenu(); updateTotal(); });

  // 菜單圖片（開團者上傳的）
  renderMenuImage(await DB.getMenuImage());
  DB.onMenuImageChange((url) => renderMenuImage(url));
}

function renderMenuImage(url) {
  const box = document.getElementById('menu-image-box');
  if (!url) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  document.getElementById('menu-image').src = url;
}
function toggleMenuImage() {
  const img = document.getElementById('menu-image');
  img.style.display = img.style.display === 'none' ? 'block' : 'none';
}

function renderSession() {
  document.getElementById('group-title').textContent = session?.title || '下午茶訂餐';
  const bar = document.getElementById('deadline-bar');
  if (!session?.deadline) { bar.textContent = '開團者尚未設定截止時間'; return; }
  const deadline = new Date(session.deadline);
  const now = new Date();
  if (now > deadline) {
    bar.textContent = '⛔ 已截止下單';
    bar.classList.add('closed');
    document.getElementById('submit-btn').disabled = true;
  } else {
    bar.classList.remove('closed');
    document.getElementById('submit-btn').disabled = false;
    tickCountdown(deadline, bar);
  }
}

function tickCountdown(deadline, bar) {
  function update() {
    const diff = deadline - new Date();
    if (diff <= 0) { renderSession(); return; }
    const h = Math.floor(diff / 3600000), m = Math.floor(diff % 3600000 / 60000), s = Math.floor(diff % 60000 / 1000);
    bar.textContent = `⏰ 距離截止還有 ${h}時 ${m}分 ${s}秒（${deadline.toLocaleString('zh-TW')} 截止）`;
    setTimeout(update, 1000);
  }
  update();
}

function renderMenu() {
  const list = document.getElementById('menu-list');
  if (!menu.length) { list.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">開團者尚未設定菜單，請稍後再來。</p>'; return; }
  const cats = [...new Set(menu.map(i => i.category || '其他'))];
  list.innerHTML = cats.map(cat => `
    <div class="category-title">${cat}</div>
    ${menu.filter(i => (i.category || '其他') === cat).map(item => `
      <div class="menu-item">
        <div class="info"><div class="name">${item.name}</div><div class="price">$${item.price}</div></div>
        <div class="qty-ctrl">
          <button onclick="changeQty('${item.id}', -1)">−</button>
          <span class="qty" id="qty-${item.id}">${cart[item.id] || 0}</span>
          <button onclick="changeQty('${item.id}', 1)">＋</button>
        </div>
      </div>`).join('')}
  `).join('');
}

function changeQty(id, delta) {
  cart[id] = Math.max(0, (cart[id] || 0) + delta);
  if (cart[id] === 0) delete cart[id];
  document.getElementById('qty-' + id).textContent = cart[id] || 0;
  updateTotal();
}

function updateTotal() {
  const total = Object.entries(cart).reduce((sum, [id, qty]) => {
    const item = menu.find(m => m.id === id);
    return sum + (item ? item.price * qty : 0);
  }, 0);
  document.getElementById('total-amount').textContent = total;
}

document.getElementById('submit-btn').addEventListener('click', async () => {
  const name = document.getElementById('orderer-name').value.trim();
  if (!name) { alert('請輸入訂購人姓名'); return; }
  if (!Object.keys(cart).length) { alert('請至少選擇一項餐點'); return; }
  const items = Object.entries(cart).map(([id, qty]) => {
    const m = menu.find(x => x.id === id);
    return { menuId: id, name: m.name, price: m.price, qty };
  });
  await DB.addOrder({
    ordererName: name,
    items,
    note: document.getElementById('order-note').value.trim(),
    createdAt: new Date().toISOString()
  });
  cart = {};
  renderMenu(); updateTotal();
  document.getElementById('orderer-name').value = '';
  document.getElementById('order-note').value = '';
  const msg = document.getElementById('success-msg');
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 4000);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

init();
</script>
</body>
</html>
